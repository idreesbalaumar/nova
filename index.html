<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA — Africa's Financial Operating System | Next-Gen Monetary Infrastructure</title>
    <meta name="description" content="NOVA is the next-generation financial infrastructure for Africa. Sub-second cross-border settlements, multi-currency liquidity rails, AI-powered treasury intelligence, and institutional MPC security." />
    <meta name="keywords" content="African Fintech, Financial Operating System, Cross-border Payment, Lagos, Nairobi, Accra, London, Treasury AI, MPC Custody" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2300F5A0'/><stop offset='50%' stop-color='%2300D2FF'/><stop offset='100%' stop-color='%23FFB800'/></linearGradient></defs><polygon points='50,5 95,25 95,75 50,95 5,75 5,25' fill='none' stroke='url(%23g)' stroke-width='8'/><circle cx='50' cy='50' r='18' fill='url(%23g)'/></svg>" />
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Synchronous Theme Hydration: Default to Light mode -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('nova_theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#060A12] dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
